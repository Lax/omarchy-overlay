# Upstream watch registry — the overlay port of omarchy-pkgs'
# .omarchy/package.json "watch" blocks (docs/upstream-sources.md upstream).
#
# One entry per trackable package, TAB separated:
#   <atom>  <upstream git url>  <mode>  <current pin>
#
# Modes:
#   tags:<regex>   latest version = last refs/tags match of <regex> (sort -V)
#   head:<ref>     latest = the commit of <ref> (tracks a moving branch)
#   none           frozen on purpose (see the comment below)
#
# scripts/check-upstream.sh consumes this file and reports drift; CI runs it
# on a schedule and opens an issue when something is stale.

app-misc/omarchy	https://github.com/omacom/omarchy	tags:v([0-9.]+)$	4.0.4
app-misc/omarchy-settings	https://github.com/omacom/omarchy	tags:v([0-9.]+)$	4.0.4
app-shells/gum	https://github.com/charmbracelet/gum	tags:v([0-9.]+)$	2.0.1
app-shells/omarchy-zsh	https://github.com/omacom-io/omarchy-zsh	tags:v([0-9.]+)$	1.5.0
app-shells/omarchy-fish	https://github.com/omacom-io/omarchy-fish	tags:v([0-9.]+)$	1.5.0
app-editors/omarchy-emacs	https://github.com/scottjones/omarchy-emacs	tags:v([0-9.]+)$	1.10.1
gui-apps/elephant	https://github.com/abenz1267/elephant	tags:v([0-9.]+)$	2.22.0
x11-misc/xdg-terminal-exec	https://gitlab.freedesktop.org/Vladimir-csp/xdg-terminal-exec	tags:v([0-9.]+)$	0.14.3
media-fonts/jetbrains-mono-nerd-basic	https://github.com/ryanoasis/nerd-fonts	tags:v([0-9.]+)$	3.5.1
# media-fonts/ia-writer pins the legacy Duospace family on purpose; upstream
# deleted the family, so the old commit is the last source (mode: none).
app-editors/omarchy-nvim	https://github.com/omacom/omarchy-pkgs	none	pinned from the pkgs repo; refresh via bump-omarchy.sh
